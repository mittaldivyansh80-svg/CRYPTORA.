<script>

const BACKEND_URL = "https://cryptora-oqwg.onrender.com";

let enrollStream = null;
let decryptStream = null;


/* ============================================
   CAMERA
============================================ */

async function startCamera(videoId) {

    const video = document.getElementById(videoId);

    if (!video) {
        throw new Error("Camera element not found.");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
    });

    video.srcObject = stream;

    return stream;
}


/* ============================================
   PAGE LOAD
============================================ */

window.onload = async function () {

    try {

        enrollStream = await startCamera("enrollVideo");
        decryptStream = await startCamera("decryptVideo");

    } catch (error) {

        console.error("Camera error:", error);

        document
            .querySelectorAll(".camera-label")
            .forEach(el => {

                el.innerHTML =
                    '<span class="status-dot warning"></span>' +
                    ' Camera permission needed';

            });

    }

};


/* ============================================
   CAPTURE IMAGE
============================================ */

function captureImage(videoId) {

    const video = document.getElementById(videoId);

    if (
        !video ||
        !video.videoWidth ||
        !video.videoHeight
    ) {

        throw new Error(
            "Camera is not ready yet. Please allow camera access and try again."
        );

    }

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return new Promise(resolve => {

        canvas.toBlob(
            blob => resolve(blob),
            "image/jpeg",
            0.9
        );

    });

}


/* ============================================
   SAFE JSON RESPONSE
============================================ */

async function getResponseData(response) {

    const text = await response.text();

    try {

        return JSON.parse(text);

    } catch (error) {

        console.error(
            "Server returned non-JSON response:",
            text
        );

        throw new Error(
            `Server returned invalid response (${response.status}).`
        );

    }

}


/* ============================================
   REGISTER / ENROLL
============================================ */

async function captureEnroll() {

    const username =
        document
            .getElementById("enrollUsername")
            .value
            .trim();

    const status =
        document.getElementById("enrollStatus");

    if (!username) {

        status.innerText =
            "Please enter a username.";

        status.className =
            "status error";

        return;

    }

    try {

        const image =
            await captureImage("enrollVideo");

        if (!image) {

            throw new Error(
                "Could not capture camera image."
            );

        }

        const form = new FormData();

        form.append(
            "username",
            username
        );

        form.append(
            "image",
            image,
            "face.jpg"
        );

        status.innerText =
            "Registering recipient...";

        status.className =
            "status pending";


        console.log(
            "Sending enrollment request to:",
            `${BACKEND_URL}/enroll`
        );


        const response =
            await fetch(
                `${BACKEND_URL}/enroll`,
                {
                    method: "POST",
                    body: form
                }
            );


        const result =
            await getResponseData(response);


        console.log(
            "CRYPTORA /enroll:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Server returned ${response.status}`
            );

        }


        status.innerText =
            result.success
                ? "✓ " + result.message
                : "✕ " + result.message;

        status.className =
            result.success
                ? "status success"
                : "status error";


    } catch (error) {

        console.error(
            "Enrollment error:",
            error
        );

        status.innerText =
            "✕ " + error.message;

        status.className =
            "status error";

    }

}


/* ============================================
   ENCRYPT DOCUMENT
============================================ */

async function encryptDocument() {

    const fileInput =
        document.getElementById("documentFile");

    const file =
        fileInput.files[0];

    const recipientsInput =
        document.getElementById(
            "authorizedRecipients"
        );

    const recipients =
        recipientsInput.value.trim();

    const status =
        document.getElementById("encryptStatus");


    if (!file) {

        status.innerText =
            "Please choose a document.";

        status.className =
            "status error";

        return;

    }


    if (!recipients) {

        status.innerText =
            "Please add at least one recipient.";

        status.className =
            "status error";

        return;

    }


    const form = new FormData();

    form.append(
        "document",
        file
    );

    form.append(
        "recipients",
        recipients
    );


    status.innerText =
        "Encrypting document...";

    status.className =
        "status pending";


    try {

        console.log(
            "Sending /encrypt request to:",
            `${BACKEND_URL}/encrypt`
        );


        const response =
            await fetch(
                `${BACKEND_URL}/encrypt`,
                {
                    method: "POST",
                    body: form
                }
            );


        const result =
            await getResponseData(response);


        console.log(
            "CRYPTORA /encrypt:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Server returned ${response.status}`
            );

        }


        if (
            result.success &&
            result.document_id
        ) {

            status.innerText =
                "✓ Encrypted successfully · ID: " +
                result.document_id;

            status.className =
                "status success";


            document.getElementById(
                "documentId"
            ).value =
                result.document_id;


            document.getElementById(
                "decryptUsername"
            ).value =
                recipients
                    .split(",")[0]
                    .trim();


        } else {

            status.innerText =
                "✕ " +
                (
                    result.message ||
                    "Encryption failed: no document ID returned."
                );

            status.className =
                "status error";

        }


    } catch (error) {

        console.error(
            "Encryption error:",
            error
        );

        status.innerText =
            "✕ " + error.message;

        status.className =
            "status error";

    }

}


/* ============================================
   DECRYPT DOCUMENT
============================================ */

async function decryptDocument() {

    const documentId =
        document
            .getElementById("documentId")
            .value
            .trim();

    const username =
        document
            .getElementById("decryptUsername")
            .value
            .trim();

    const status =
        document.getElementById("decryptStatus");


    if (!documentId || !username) {

        status.innerText =
            "Enter the document ID and recipient username.";

        status.className =
            "status error";

        return;

    }


    try {

        const image =
            await captureImage("decryptVideo");


        const form = new FormData();

        form.append(
            "document_id",
            documentId
        );

        form.append(
            "username",
            username
        );

        form.append(
            "image",
            image,
            "face.jpg"
        );


        status.innerText =
            "Checking authorization and face...";

        status.className =
            "status pending";


        console.log(
            "Sending /decrypt request to:",
            `${BACKEND_URL}/decrypt`
        );


        const response =
            await fetch(
                `${BACKEND_URL}/decrypt`,
                {
                    method: "POST",
                    body: form
                }
            );


        const result =
            await getResponseData(response);


        console.log(
            "CRYPTORA /decrypt:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Server returned ${response.status}`
            );

        }


        if (result.success) {

            status.innerText =
                "✓ Face verified · document decrypted · event " +
                result.event_id;

            status.className =
                "status success";


            const link =
                document.getElementById(
                    "downloadLink"
                );


            link.href =
                result.download.startsWith("http")
                    ? result.download
                    : BACKEND_URL + result.download;


            link.style.display =
                "inline-flex";


        } else {

            status.innerText =
                "✕ " +
                (
                    result.message ||
                    "Decryption failed."
                );

            status.className =
                "status error";


            document.getElementById(
                "downloadLink"
            ).style.display =
                "none";

        }


    } catch (error) {

        console.error(
            "Decryption error:",
            error
        );

        status.innerText =
            "✕ " + error.message;

        status.className =
            "status error";

    }

}


/* ============================================
   AUDIT
============================================ */

async function loadAudit() {

    const audit =
        document.getElementById("auditOutput");

    const summary =
        document.getElementById("auditSummary");


    audit.innerText =
        "Checking ledger...";


    try {

        console.log(
            "Sending /audit request to:",
            `${BACKEND_URL}/audit`
        );


        const response =
            await fetch(
                `${BACKEND_URL}/audit`
            );


        const result =
            await getResponseData(response);


        console.log(
            "CRYPTORA /audit:",
            response.status,
            result
        );


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Server returned ${response.status}`
            );

        }


        audit.innerText =
            JSON.stringify(
                result,
                null,
                2
            );


        const valid =
            result.ledger_status === "VALID";


        if (valid) {

            summary.innerHTML =
                '<span class="audit-state valid">✓ Ledger valid</span>' +
                '<span>Hash links are consistent.</span>';

        } else {

            summary.innerHTML =
                '<span class="audit-state invalid">✕ Ledger check failed</span>' +
                '<span>The audit chain verification failed.</span>';

        }


    } catch (error) {

        console.error(
            "Audit error:",
            error
        );


        audit.innerText =
            "Could not load the audit ledger.";


        summary.innerHTML =
            '<span class="audit-state invalid">✕ Server unavailable</span>' +
            '<span>' +
            error.message +
            '</span>';

    }

}

</script>
